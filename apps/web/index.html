<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiniCoze MVP 开发骨架" />
    <title>MiniCoze</title>
    <script>
      // 首屏先定外观，避免刷新时闪一下再跳到用户设置（与 shared/theme/theme-store.ts 保持一致）
      (function () {
        var root = document.documentElement;
        var pick = function (key, allowed, fallback) {
          try {
            var raw = localStorage.getItem(key);
            return allowed.indexOf(raw) >= 0 ? raw : fallback;
          } catch (error) {
            return fallback;
          }
        };
        try {
          var theme = pick('minicoze-theme', ['light', 'dark', 'system'], 'light');
          var resolved = theme;
          if (theme === 'system') {
            resolved =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = resolved;
          root.dataset.accent = pick('minicoze-accent', ['purple', 'blue', 'green', 'red'], 'purple');
          root.dataset.fontSize = pick('minicoze-font-size', ['small', 'normal', 'large'], 'normal');
          root.dataset.density = pick('minicoze-density', ['compact', 'comfortable'], 'comfortable');
        } catch (error) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
