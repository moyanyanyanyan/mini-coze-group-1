<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780"><rect width="640" height="780" rx="16" fill="#faf8f3"/><rect x="38" y="38" width="564" height="704" rx="12" fill="#fffdf9" stroke="#e2ddeb"/><text x="70" y="102" font-size="14" fill="#88769f">模拟资料图片 · 非真实原文件</text><text x="70" y="164" font-size="30" font-family="sans-serif" fill="#302938">售后服务流程</text><path d="M70 192H570" stroke="#ddd5e8"/><g font-family="sans-serif" fill="#534d60"><text x="70" y="260" font-size="22">01  提交售后申请</text><text x="70" y="300" font-size="16">在订单详情页选择退货原因。</text><text x="70" y="388" font-size="22">02  确认商品状态</text><text x="70" y="428" font-size="16">商品保持完好，并保留相关凭证。</text><text x="70" y="516" font-size="22">03  寄回与退款</text><text x="70" y="556" font-size="16">验收完成后，退款按原支付路径退回。</text></g><text x="70" y="686" font-size="13" fill="#8a8193">此图片仅用于验证图片预览与 OCR 文本展示。</text></svg>