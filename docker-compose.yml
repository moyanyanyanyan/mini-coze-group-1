services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minicoze}
      POSTGRES_USER: ${POSTGRES_USER:-minicoze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minicoze}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minicoze} -d ${POSTGRES_DB:-minicoze}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

